# XcodeGen 工程描述。
#
# 仓库里已经有手写的 DSHRemote.xcodeproj，正常情况下用不到这个文件。
# 只有在 Xcode 工程损坏、或者你想改结构时，才用它重新生成：
#
#   brew install xcodegen
#   xcodegen generate
#
name: DSHRemote

options:
  bundleIdPrefix: dev.dshremote
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  DSHRemote:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DSHRemote
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: DSHRemote
        PRODUCT_BUNDLE_IDENTIFIER: dev.dshremote.app
        INFOPLIST_FILE: DSHRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

schemes:
  DSHRemote:
    build:
      targets:
        DSHRemote: all
    run:
      config: Debug
    archive:
      config: Release
